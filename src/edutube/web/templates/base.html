<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}EduTube Agent{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">EduTube Agent</a>
    <span class="brand-sub">{{ channel_name or "" }}</span>
  </header>
  <main class="page">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
